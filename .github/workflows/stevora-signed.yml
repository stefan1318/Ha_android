name: STEVORA signed installable APK
# Signing setup validation after GitHub Secrets configuration

'on':
  workflow_dispatch:
  push:
    branches:
      - feature/stevora-companion
    paths:
      - 'app/**'
      - 'scripts/check_stevora_release_gate.py'
      - 'common/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/prepare_stevora_branding.py'
      - '.github/workflows/stevora-signed.yml'

permissions:
  contents: read

concurrency:
  group: ste-vora-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    name: Build signed STEVORA minimal APK
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate signing setup
        env:
          STEVORA_KEYSTORE_BASE64: ${{ secrets.STEVORA_KEYSTORE_BASE64 }}
          STEVORA_KEYSTORE_PASSWORD: ${{ secrets.STEVORA_KEYSTORE_PASSWORD }}
          STEVORA_KEY_ALIAS: ${{ secrets.STEVORA_KEY_ALIAS }}
          STEVORA_KEY_PASSWORD: ${{ secrets.STEVORA_KEY_PASSWORD }}
        run: |
          for key in STEVORA_KEYSTORE_BASE64 STEVORA_KEYSTORE_PASSWORD STEVORA_KEY_ALIAS STEVORA_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions signing secret: $key"
              exit 1
            fi
          done
          printf '%s' "$STEVORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stevora-release.keystore"
          chmod 600 "$RUNNER_TEMP/stevora-release.keystore"
      - name: Validate STEVORA final test release gate
        run: python3 scripts/check_stevora_release_gate.py
      - name: Prepare branding
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/check_stevora_resources.py
          python3 scripts/prepare_stevora_branding.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build signed STEVORA minimal release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/stevora-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.STEVORA_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.STEVORA_KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.STEVORA_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleMinimalRelease --stacktrace
      - name: Verify signed APK and identity
        run: |
          APK=$(find app/build/outputs/apk/minimal/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep "package: name='com.stevora.companion.minimal'"
      - name: Verify STEVORA Stable version
        run: |
          APK=$(find app/build/outputs/apk/minimal/release -name '*.apk' -type f | head -n 1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep "versionName='2.0.0-minimal'"
      - name: Upload installable signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stevora-companion-2.0.0-stable-signed-apk
          path: app/build/outputs/apk/minimal/release/*.apk
          if-no-files-found: error
          retention-days: 30

name: STEVORA Android debug build

'on':
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build STEVORA debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate STEVORA logo and prepare Android launcher icons
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/prepare_stevora_branding.py
      - name: Set up Android build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          mock-google-services: "true"
      - name: Build STEVORA debug APK
        run: ./gradlew :app:assembleMinimalDebug --stacktrace
      - name: Verify compiled STEVORA branding resources
        run: python3 scripts/verify_stevora_apk.py
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stevora-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

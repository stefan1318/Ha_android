name: STEVORA Android debug build

'on':
  workflow_dispatch:
  push:
    branches:
      - feature/stevora-companion
      - fix/stevora-cross-home-discovery-20261119
      - feature/stevora-admin-managers-buildable
    paths:
      - 'app/**'
      - 'scripts/check_stevora_release_gate.py'
      - 'common/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/stevora-debug.yml'

permissions:
  contents: read

concurrency:
  group: ste-vora-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build STEVORA debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate STEVORA final test release gate
        run: python3 scripts/check_stevora_release_gate.py
      - name: Validate STEVORA localized Android resources
        run: python3 scripts/check_stevora_resources.py
      - name: Validate STEVORA logo and prepare Android launcher icons
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/prepare_stevora_branding.py
          mkdir -p app/src/main/assets/stevora
          cp app/src/main/res/drawable-nodpi/stevora_logo.png app/src/main/assets/stevora/approved_logo.png
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK on hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build debug APK
        run: ./gradlew :app:assembleMinimalDebug --stacktrace
      - name: Verify compiled STEVORA branding resources
        run: python3 scripts/verify_stevora_apk.py minimal/debug
      - name: Upload unsigned test APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stevora-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

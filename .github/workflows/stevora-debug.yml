name: STEVORA Android debug build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout STEVORA development branch
        uses: actions/checkout@v4
        with:
          ref: feature/stevora-companion
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK on hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build STEVORA debug APK
        run: ./gradlew :app:assembleMinimalDebug --stacktrace
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stevora-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

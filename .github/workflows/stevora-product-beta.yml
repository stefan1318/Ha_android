name: STEVORA Android 2.1.0 product beta

'on':
  workflow_dispatch:
  push:
    branches:
      - feature/stevora-companion
    paths:
      - 'app/**'
      - 'common/**'
      - '.github/workflows/stevora-product-beta.yml'
      - 'STEVORA_PRODUCT_RELEASE_GATE.md'

permissions:
  contents: read

concurrency:
  group: stevora-product-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-beta:
    name: Build and validate STEVORA product APK
    if: github.ref == 'refs/heads/feature/stevora-companion'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout actual STEVORA product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert STEVORA product source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/stevora-companion'
          grep -Fq '<string name="app_name">STEVORA</string>' common/src/main/res/values/strings.xml
          grep -Fq 'applicationId = "com.stevora.companion"' app/build.gradle.kts
          grep -Fq 'versionName = "2.1.0"' app/build.gradle.kts
          if grep -q '<string name="app_name">Home Assistant</string>' common/src/main/res/values/strings.xml; then
            echo "::error::Unbranded Home Assistant app_name in STEVORA product branch. Do not distribute."
            exit 1
          fi
      - name: Setup Android build environment
        uses: ./.github/actions/setup-build-env # zizmor: ignore[self-repository] GitHub local actions require a checked-out relative path
        with:
          mock-google-services: "true"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Add STEVORA package identities to CI-only mock Firebase config
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("app/google-services.json")
          data = json.loads(path.read_text())
          template = data["client"][0]
          for package in ("com.stevora.companion", "com.stevora.companion.debug"):
              if not any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package for c in data["client"]):
                  import copy
                  client = copy.deepcopy(template)
                  client["client_info"]["android_client_info"]["package_name"] = package
                  data["client"].append(client)
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          python3 -m json.tool app/google-services.json > /dev/null
      - name: Validate official STEVORA logo and generate safe-zone launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_stevora_release_gate.py
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/prepare_stevora_branding.py
          mkdir -p app/src/main/assets/stevora
          cp app/src/main/res/drawable-nodpi/stevora_logo.png app/src/main/assets/stevora/approved_logo.png
      - name: Compile and run product unit tests
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace --info --refresh-dependencies --no-daemon
      - name: Assemble full debug product
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon
      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/full/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "${apks[0]}" | tee apk-identity.txt
          grep -q "package: name='com.stevora.companion.debug'" apk-identity.txt
          grep -q "versionName='2.1.0'" apk-identity.txt
          python3 scripts/verify_stevora_apk.py full/debug
          cp "${apks[0]}" STEVORA-Companion-2.1.0-full-debug.apk
          printf 'commit=%s\nbranch=%s\nvariant=fullDebug\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > build-provenance.txt
      - name: Upload validated STEVORA APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STEVORA-Companion-2.1.0-full-debug
          path: |
            STEVORA-Companion-2.1.0-full-debug.apk
            apk-identity.txt
            build-provenance.txt
          retention-days: 14
          if-no-files-found: error

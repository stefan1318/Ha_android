name: STEVORA Android ASM diagnostic

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'common/src/main/kotlin/io/homeassistant/companion/android/common/notifications/NotificationDeleteReceiver.kt'
      - '.github/workflows/stevora-asm-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: stevora-asm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-asm:
    name: Diagnose Gradle ASM instrumentation
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Reproduce common ASM instrumentation with full stacktrace
        run: ./gradlew :common:transformDebugClassesWithAsm --stacktrace --info --no-configuration-cache --max-workers=2

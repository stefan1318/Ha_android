name: STEVORA Companion 2.1 Full Release
# Trigger full signed build after STEVORA logo resource retention fix

'on':
  workflow_dispatch:
    inputs:
      firebase_distribution:
        description: Upload verified signed APK to Firebase App Distribution
        type: boolean
        required: true
        default: false
  push:
    branches:
      - feature/stevora-companion
      - feature/stevora-os-dev4-android-sync
      - feature/stevora-os-dev2-android-2-2
      - policy/stevora-os-client-20261120 # temporary opt-in signing smoke branch
    paths:
      - '.github/workflows/stevora-full-release.yml'
      - 'scripts/verify_stevora_apk.py'
      - 'scripts/check_stevora_release_gate.py'
      - 'app/build.gradle.kts'
      - 'common/**'
      - '.github/mock-google-services.json'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'scripts/check_stevora_update_contract.py'
      - 'scripts/check_stevora_ecosystem.py'
      - 'STEVORA_ECOSYSTEM_CONTRACT.md'
      - 'app/src/main/kotlin/io/homeassistant/companion/android/stevora/**'

permissions:
  contents: read

concurrency:
  group: ste-vora-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-release:
    name: Build signed STEVORA full APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate full release credentials
        env:
          STEVORA_KEYSTORE_BASE64: ${{ secrets.STEVORA_KEYSTORE_BASE64 }}
          STEVORA_KEYSTORE_PASSWORD: ${{ secrets.STEVORA_KEYSTORE_PASSWORD }}
          STEVORA_KEY_ALIAS: ${{ secrets.STEVORA_KEY_ALIAS }}
          STEVORA_KEY_PASSWORD: ${{ secrets.STEVORA_KEY_PASSWORD }}
          STEVORA_FIREBASE_CONFIG_BASE64: ${{ secrets.STEVORA_FIREBASE_CONFIG_BASE64 }}
          STEVORA_ACTION_EVENT: ${{ github.event_name }}
          STEVORA_FIREBASE_DISTRIBUTION: ${{ inputs.firebase_distribution }}
        run: |
          for key in STEVORA_KEYSTORE_BASE64 STEVORA_KEYSTORE_PASSWORD STEVORA_KEY_ALIAS STEVORA_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          printf '%s' "$STEVORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stevora-release.keystore"
          chmod 600 "$RUNNER_TEMP/stevora-release.keystore"
          if [ -n "$STEVORA_FIREBASE_CONFIG_BASE64" ]; then
            printf '%s' "$STEVORA_FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('app/google-services.json').read_text())
          expected='com.stevora.companion'
          names=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in cfg.get('client',[])]
          if expected not in names:
              raise SystemExit(f'Firebase config must include {expected}')
          if cfg.get('project_info',{}).get('project_number') in (None, '', 'project_number'):
              raise SystemExit('Firebase project number missing or placeholder')
          print('Firebase configuration matches full application ID')
          PY
          else
            # A CI-only Firebase fixture may compile a signed smoke APK, but it cannot be
            # used for FCM, App Distribution, or a customer release.
            if [[ "$STEVORA_ACTION_EVENT" == "workflow_dispatch" && "$STEVORA_FIREBASE_DISTRIBUTION" == "true" ]]; then
              echo "::error::Real STEVORA_FIREBASE_CONFIG_BASE64 required for Firebase distribution."
              exit 1
            fi
            cp .github/mock-google-services.json app/google-services.json
            echo "::warning::Using CI-only mock Firebase configuration; signed APK is for internal smoke tests, not distribution."
          fi
      - name: Validate release gate and prepare branding
        run: |
          python3 scripts/check_stevora_update_contract.py
          python3 scripts/check_stevora_ecosystem.py
          python3 scripts/check_stevora_release_gate.py
          python3 scripts/check_stevora_resources.py
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/prepare_stevora_branding.py
          mkdir -p app/src/main/assets/stevora
          cp app/src/main/res/drawable-nodpi/stevora_logo.png app/src/main/assets/stevora/approved_logo.png
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test settings access, navigation and catalog search
        run: |
          kotlinc app/src/main/kotlin/io/homeassistant/companion/android/stevora/StevoraSettingsCatalog.kt \
            scripts/tests/StevoraSettingsCatalogTest.kt -include-runtime -d "$RUNNER_TEMP/settings-test.jar"
          java -jar "$RUNNER_TEMP/settings-test.jar"
      - name: Verify Maven Central dependency availability
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            "org/jetbrains/kotlinx/kotlinx-coroutines-play-services/1.11.0/kotlinx-coroutines-play-services-1.11.0.pom" \
            "io/sentry/sentry-android-core/8.63.0/sentry-android-core-8.63.0.pom" \
            "sh/calvin/reorderable/reorderable-android/3.1.0/reorderable-android-3.1.0.pom"; do
            status="$(curl -L -I -sS --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 50 --output /dev/null --write-out '%{http_code}' \
              "https://repo.maven.apache.org/maven2/$artifact" || true)"
            echo "Maven Central ${artifact%%/*}/...: HTTP ${status:-unreachable}"
          done
      - name: Build signed STEVORA full release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/stevora-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.STEVORA_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.STEVORA_KEY_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.STEVORA_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Hilt bytecode instrumentation can race generated Hilt classes in parallel/cached release builds.
          # Force fresh, ordered processing of :common and the full release variant.
          ./gradlew --stop || true
          ./gradlew :common:clean :app:clean :app:assembleFullRelease \
            --no-build-cache --no-configuration-cache --no-parallel --max-workers=2 --refresh-dependencies --stacktrace
      - name: Verify signed full APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.stevora.companion'"
          echo "$BADGING" | grep -F "versionName='2.1.0-full'"
          python3 scripts/verify_stevora_apk.py
          sha256sum "$APK"
      - name: Upload STEVORA Companion 2.1 Full signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stevora-companion-2.1-full-signed-apk-smoke
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Firebase service account credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.firebase_distribution }}
        shell: bash
        env:
          STEVORA_FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.STEVORA_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          STEVORA_FIREBASE_APP_ID: ${{ secrets.STEVORA_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$STEVORA_FIREBASE_SERVICE_ACCOUNT_BASE64" || -z "$STEVORA_FIREBASE_APP_ID" ]]; then
            echo "::error::Set STEVORA_FIREBASE_SERVICE_ACCOUNT_BASE64 and STEVORA_FIREBASE_APP_ID in GitHub Actions secrets."
            exit 1
          fi
          printf '%s' "$STEVORA_FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/stevora-firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/stevora-firebase-sa.json"
          python3 - "$RUNNER_TEMP/stevora-firebase-sa.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              credentials = json.load(source)
          assert credentials.get("type") == "service_account", "Firebase service account JSON required"
          assert all(credentials.get(key) for key in ("project_id", "client_email", "private_key"))
          print("Firebase service account validated without exposing its credentials")
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/stevora-firebase-sa.json" >> "$GITHUB_ENV"

      - name: Publish signed full APK to Firebase App Distribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.firebase_distribution }}
        shell: bash
        env:
          STEVORA_FIREBASE_APP_ID: ${{ secrets.STEVORA_FIREBASE_APP_ID }}
          STEVORA_FIREBASE_TESTER_GROUPS: ${{ secrets.STEVORA_FIREBASE_TESTER_GROUPS }}
        run: | # zizmor: ignore[adhoc-packages] Firebase CLI pinned for manual, service-account-gated distribution
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/full/release -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          npm install --global firebase-tools@15.34.2
          options=()
          if [[ -n "$STEVORA_FIREBASE_TESTER_GROUPS" ]]; then
            options+=(--groups "$STEVORA_FIREBASE_TESTER_GROUPS")
          fi
          firebase appdistribution:distribute "${apks[0]}" \
            --app "$STEVORA_FIREBASE_APP_ID" \
            --release-notes "STEVORA Android 2.1.0-full | commit $GITHUB_SHA" \
            "${options[@]}"

      - name: Remove temporary signing and Firebase credentials
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/stevora-release.keystore" "$RUNNER_TEMP/stevora-firebase-sa.json"

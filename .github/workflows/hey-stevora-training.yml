name: Hey STEVORA dataset preparation tests

on:
  push:
    branches:
      - feature/hey-stevora-training
    paths:
      - "training/hey_stevora/**"
      - ".github/workflows/hey-stevora-training.yml"
  pull_request:
    paths:
      - "training/hey_stevora/**"
      - ".github/workflows/hey-stevora-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/hey_stevora/requirements-test.txt
      - name: Install dataset test dependencies
        run: python -m pip install -r training/hey_stevora/requirements-test.txt
      - name: Validate audio preparation and speaker isolation
        run: python -m unittest discover -s training/hey_stevora -p 'test_*.py' -v
